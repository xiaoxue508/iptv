# iptvd configuration (key=value, one per line)
# Values below match the previous NAS container (epg.py defaults).

# --- platform endpoints (whole control plane is plain HTTP) ---
eas_host=124.132.240.38
epg_host=60.212.113.86
timeout=15

# --- STB identity (used for login signature) ---
userid=053502686836
stbid=000004370020A32000EF6CEFC689337E
stbip=10.156.22.20
stbmac=6C:EF:C6:89:33:7E
auth_key=68682600
stbtype=S-010W-AV2A
stbversion=S-010W-AV2A_SW_SD_A_R2.03.19

# --- HTTP client fingerprints ---
ua=webkit;Resolution(PAL,720P,1080P)
xhr=com.android.smart.terminal.iptv

# --- local endpoints / templates ---
# rtp2httpd address (rtp2httpd listens on 5141)
r2h=http://192.168.123.1:5141
# x-tvg-url written into the playlist
m3u_epg_url=http://192.168.123.1:5150/epg.xml
# catchup source template for rtp2httpd, {uid} = UserChannelID
bridge_tpl=http://192.168.123.1:5150/c?ch={uid}&s=${(b)yyyyMMddHHmmss}&u=${timestamp}
# XMLTV generator-info-url (set to NAS value during byte comparison)
gen_url=http://192.168.123.1:5150

# --- TTLs (seconds) ---
ttl_progs=900
ttl_tvod=3600
ttl_epg=21600
ttl_channels=7200
min_channels=150

# --- EPG window / workers ---
epg_past=1
epg_future=1
worker_s=120
xmltv_wait_s=180

# --- listen port (use 5160 during golden comparison) ---
port=5150

# --- paths (persistent on flash / volatile in tmpfs) ---
data_dir=/etc/iptvd
cache_dir=/tmp/iptvd
